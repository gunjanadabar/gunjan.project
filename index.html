<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Quiz: You're Mine Forever! 💕</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #d63384;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
            overflow: hidden;
        }
        h1 {
            font-size: 3em;
            animation: heartbeat 1.5s infinite;
            margin-bottom: 10px;
        }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.3); }
            70% { transform: scale(1); }
        }
        .greeting {
            font-size: 2em;
            margin-bottom: 20px;
            animation: wiggle 2s infinite;
        }
        @keyframes wiggle {
            0%, 7% { transform: rotateZ(0deg); }
            15% { transform: rotateZ(-15deg); }
            20% { transform: rotateZ(5deg); }
            25% { transform: rotateZ(-5deg); }
            30%, 100% { transform: rotateZ(0deg); }
        }
        .question {
            background: rgba(255,255,255,0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 500px;
            text-align: center;
            margin: 20px;
            animation: bounceIn 0.8s;
        }
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }
        button {
            background: linear-gradient(45deg, #ff6b9d, #ff8e8e);
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
            font-family: inherit;
        }
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        .fake-button {
            background: linear-gradient(45deg, #ccc, #ddd);
            color: #999 !important;
            cursor: not-allowed;
            pointer-events: none;
            opacity: 0.5;
            transform: none !important;
        }
        button.fake-button:hover {
            transform: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        .heart {
            position: absolute;
            color: #ff69b4;
            font-size: 20px;
            animation: float 6s infinite linear;
        }
        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }
        #final {
            font-size: 1.5em;
            text-align: center;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="hearts" id="hearts"></div>
    <h1>💖 Valentine Quiz 💖</h1>
    <div class="greeting">Hi! Momo 😘</div>
    <div id="quiz">
        <div class="question" id="q1">
            <h2>Momo, Do you love me? 😍</h2>
            <button class="fake-button">Nah... 😏</button>
            <button onclick="next(1)">YES! Absolutely! 💕</button>
        </div>
        <div class="question hidden" id="q2">
            <h2>Am I the cutest ever? 🥰</h2>
            <button class="fake-button">Meh... 🙄</button>
            <button onclick="next(2)">Obviously! World's cutest! 🌟</button>
        </div>
        <div class="question hidden" id="q3">
            <h2>Will you be mine forever? 💍</h2>
            <button class="fake-button">Maybe later... ⏳</button>
            <button onclick="next(3)">Forever & always! ❤️</button>
        </div>
    </div>
    <div id="final" class="question hidden">
        <h2>PERFECT! You're locked in love! 🎉</h2>
        <p>Happy Valentine's Day! No escape from this cuteness! 😘<br>We make the best team ever! 🚀💑</p>
        <button onclick="restart()">Play Again? 😜</button>
    </div>

    <script>
        function next(q) {
            document.getElementById('q' + q).classList.add('hidden');
            if (q < 3) {
                document.getElementById('q' + (q+1)).classList.remove('hidden');
            } else {
                document.getElementById('final').classList.remove('hidden');
                createHearts();
            }
        }
        function restart() {
            location.reload();
        }
        function createHearts() {
            const heartsContainer = document.getElementById('hearts');
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.innerHTML = '💖';
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
                    heartsContainer.appendChild(heart);
                    setTimeout(() => heart.remove(), 7000);
                }, i * 100);
            }
        }
    </script>
</body>
</html>
